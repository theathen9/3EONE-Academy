services:
  # ============================================================
  # Laravel PHP-FPM Application
  # ============================================================
  app:
    image: systemacademy-app:latest

    container_name: systemacademy_app

    restart: unless-stopped

    working_dir: /var/www/html

    env_file:
      - .env.production

    volumes:
      - ./storage:/var/www/html/storage

      - ./bootstrap/cache:/var/www/html/bootstrap/cache

      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro

      - ./docker/php/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro

      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:ro

    depends_on:
      postgres:
        condition: service_healthy

      redis:
        condition: service_healthy

    networks:
      - laravel

  # ============================================================
  # Laravel Queue Worker
  # ============================================================
  worker:
    image: systemacademy-app:latest

    container_name: systemacademy_worker

    restart: unless-stopped

    working_dir: /var/www/html

    command: >
      php artisan queue:work redis
      --sleep=3
      --tries=3
      --timeout=90

    env_file:
      - .env.production

    volumes:
      - ./storage:/var/www/html/storage

    depends_on:
      app:
        condition: service_started

      redis:
        condition: service_healthy

    networks:
      - laravel

  # ============================================================
  # Laravel Scheduler
  # ============================================================
  scheduler:
    image: systemacademy-app:latest

    container_name: systemacademy_scheduler

    restart: unless-stopped

    working_dir: /var/www/html

    command: >
      sh -c "
      while true;
      do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done
      "

    env_file:
      - .env.production

    volumes:
      - ./storage:/var/www/html/storage

    depends_on:
      app:
        condition: service_started

    networks:
      - laravel

  # ============================================================
  # Nginx
  # ============================================================
  nginx:
    image: nginx:1.28-alpine

    container_name: systemacademy_nginx

    restart: unless-stopped

    ports:
      - "80:80"

      - "443:443"

    volumes:
      - ./public:/var/www/html/public:ro

      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

      # SSL certificates
      - ./ssl:/etc/nginx/ssl:ro

    depends_on:
      - app

    networks:
      - laravel

  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:17-alpine

    container_name: systemacademy_postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]

      interval: 10s

      timeout: 5s

      retries: 5

    networks:
      - laravel

  # ============================================================
  # Redis
  # ============================================================
  redis:
    image: redis:8-alpine

    container_name: systemacademy_redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

      interval: 10s

      timeout: 5s

      retries: 5

    networks:
      - laravel

# ============================================================
# Volumes
# ============================================================
volumes:
  postgres_data:

  redis_data:

# ============================================================
# Network
# ============================================================
networks:
  laravel:
    driver: bridge
